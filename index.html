<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyStack - Academic Workspace</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #334155; margin-bottom: 24px; flex-wrap: wrap; gap: 15px; }
    .brand { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
    .brand span { color: var(--accent); }

    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    input[type="text"] { background: var(--card-bg); border: 1px solid #334155; padding: 8px 14px; border-radius: 6px; color: var(--text); outline: none; width: 220px; }
    input[type="text"]:focus { border-color: var(--accent); }

    .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; }
    .btn-secondary:hover { background: #475569; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
    .card { background: var(--card-bg); border: 1px solid #334155; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.15s, border-color 0.15s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .card-thumb { width: 100%; height: 120px; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .card-body { padding: 12px; }
    .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .card-category { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Game Modal / Viewer */
    #player-modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 99; flex-direction: column; }
    #player-bar { background: #1e293b; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
    #player-frame { width: 100%; height: 100%; border: none; flex: 1; }
  </style>
</head>
<body>

  <header>
    <div class="brand">📚 Study<span>Stack</span></div>
    <div class="controls">
      <input type="text" id="search" placeholder="Search modules..." onkeyup="filterCards()">
      <button class="btn btn-secondary" onclick="launchCloaked()">🕶️ Stealth Window</button>
    </div>
  </header>

  <main>
    <div class="grid" id="game-grid">
      <!-- Card items: replace data-src with your hosted game links -->
      <div class="card" onclick="openGame('Slope', 'https://example.com/games/slope')">
        <div class="card-thumb">🟢</div>
        <div class="card-body">
          <div class="card-title">Slope Runner</div>
          <div class="card-category">Arcade</div>
        </div>
      </div>

      <div class="card" onclick="openGame('Retro Bowl', 'https://example.com/games/retrobowl')">
        <div class="card-thumb">🏈</div>
        <div class="card-body">
          <div class="card-title">Retro Bowl</div>
          <div class="card-category">Sports</div>
        </div>
      </div>

      <div class="card" onclick="openGame('OvO Platformer', 'https://example.com/games/ovo')">
        <div class="card-thumb">🏃</div>
        <div class="card-body">
          <div class="card-title">OvO</div>
          <div class="card-category">Skill</div>
        </div>
      </div>

      <div class="card" onclick="openGame('2048 Puzzle', 'https://example.com/games/2048')">
        <div class="card-thumb">🔢</div>
        <div class="card-body">
          <div class="card-title">2048 Logic</div>
          <div class="card-category">Puzzle</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Player Modal -->
  <div id="player-modal">
    <div id="player-bar">
      <span id="player-title" style="font-weight: 600;">Game</span>
      <div>
        <button class="btn btn-secondary" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        <button class="btn" onclick="closeGame()" style="background:#ef4444; margin-left: 8px;">✕ Close</button>
      </div>
    </div>
    <iframe id="player-frame" src=""></iframe>
  </div>

  <script>
    // Search Filter
    function filterCards() {
      const q = document.getElementById('search').value.toLowerCase();
      document.querySelectorAll('.card').forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    // Modal Player
    function openGame(title, url) {
      document.getElementById('player-title').innerText = title;
      document.getElementById('player-frame').src = url;
      document.getElementById('player-modal').style.display = 'flex';
    }

    function closeGame() {
      document.getElementById('player-frame').src = '';
      document.getElementById('player-modal').style.display = 'none';
    }

    function toggleFullscreen() {
      const frame = document.getElementById('player-frame');
      if (frame.requestFullscreen) frame.requestFullscreen();
    }

    // Stealth about:blank Launcher
    function launchCloaked() {
      const win = window.open('about:blank', '_blank');
      if (!win) {
        alert('Allow popups to launch stealth mode.');
        return;
      }
      const doc = win.document;
      doc.title = 'Google Docs';
      
      const link = doc.createElement('link');
      link.rel = 'icon';
      link.href = 'https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico';
      doc.head.appendChild(link);

      const frame = doc.createElement('iframe');
      frame.src = window.location.href;
      frame.style = 'position:fixed; top:0; left:0; width:100%; height:100%; border:none; margin:0; padding:0;';
      doc.body.style.margin = '0';
      doc.body.appendChild(frame);
    }
  </script>
</body>
</html>
